# Spring Datasource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=your_mysql_username
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update # create, create-drop, validate, update, none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# For MySQL 5, use org.hibernate.dialect.MySQL5InnoDBDialect

# JWT Configuration
jwt.secret======================JWTSecretKey=========================
jwt.expiration=86400 # in seconds (24 hours)

# Server Port (Optional)
# server.port=8080

# Logging (Optional)
# logging.level.org.springframework.web=DEBUG
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Actuator Endpoints (Optional - for monitoring, ensure security if enabled in production)
# management.endpoints.web.exposure.include=health,info,metrics
# management.endpoint.health.show-details=always
